8.6 384.2 233.4)"/><rect x="395.6" y="256.5" width="52" height="22" rx="11" fill="none" stroke="url(#goldSoft)" stroke-width="7.5" transform="rotate(424.3 421.6 267.5)"/><rect x="397.6" y="258.5" width="48" height="18" rx="9" fill="none" stroke="#FFF6CE" stroke-width="1.4" opacity="0.65" transform="rotate(424.3 421.6 267.5)"/>
